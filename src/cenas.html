<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Pesquise falas nas legendas locais e filtre cenas pelo seu progresso.">
<title>Busca de cenas · Rustyfin</title>
<link rel="icon" type="image/png" href="/admin/favicon.png">
<link rel="preload" href="/assets/fontes/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Hallmark · v2.0.0 · theme: coral (dealt 1/3, seed admin-panel-self-hosted-media-705e·f938bf56·2026-11-18·r0) · shape: app screen · genre: modern-minimal · redesign: full · fontes: Geist (OFL) */
  /* Hallmark · critique: o horário é o trilho de leitura e a fala ocupa o primeiro plano */
  @font-face { font-family: "Geist"; src: url("/assets/fontes/geist-latin.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  @font-face { font-family: "Geist Mono"; src: url("/assets/fontes/geist-mono-latin.woff2") format("woff2"); font-weight: 100 900; font-style: normal; font-display: swap; }
  :root {
    color-scheme: light dark;
    --paper: oklch(97% 0.006 55); --paper-2: oklch(94.5% 0.007 55); --paper-3: oklch(91.5% 0.009 55);
    --panel: oklch(99% 0.004 75);
    --ink: oklch(21% 0.012 38); --ink-2: oklch(29% 0.013 40); --muted: oklch(47% 0.013 45);
    --rule: oklch(87% 0.009 55); --rule-2: oklch(81% 0.011 55);
    --accent: oklch(74% 0.125 30); --accent-ink: oklch(21% 0.012 38);
    --action: oklch(54% 0.165 29); --action-ink: oklch(99% 0.004 75); --action-hover: oklch(49% 0.165 29);
    --link: oklch(48% 0.165 29); --focus: oklch(54% 0.17 30);
    --ok: oklch(46% 0.1 155); --ok-wash: oklch(95% 0.03 155);
    --warn: oklch(48% 0.1 65); --warn-wash: oklch(95% 0.045 80);
    --danger: oklch(48% 0.17 27); --danger-wash: oklch(95% 0.03 25);
    --scrim: oklch(20% 0.01 40 / 0.5);
    --font: "Geist", ui-sans-serif, system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
    --radius: 8px; --radius-sm: 6px; --radius-pill: 999px;
    --edge: inset 0 1px 0 oklch(100% 0 0 / 0.9), 0 0 0 1px oklch(32% 0.03 50 / 0.12), 0 1px 2px oklch(20% 0.01 35 / 0.05);
    --lift: 0 8px 24px -8px oklch(32% 0.03 50 / 0.3);
    --dur-micro: 120ms; --dur-short: 200ms; --ease: cubic-bezier(0.2, 0, 0, 1);
    --text-xs: 0.8125rem; --text-sm: 0.875rem; --text-base: 1rem; --text-lg: 1.125rem; --text-xl: 1.375rem; --text-2xl: 1.75rem;
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: oklch(19% 0.01 40); --paper-2: oklch(22.5% 0.011 40); --paper-3: oklch(26% 0.012 40);
    --panel: oklch(23.5% 0.011 40);
    --ink: oklch(95% 0.006 70); --ink-2: oklch(86% 0.008 65); --muted: oklch(72% 0.012 55);
    --rule: oklch(32% 0.012 45); --rule-2: oklch(40% 0.013 45);
    --accent: oklch(74% 0.125 30); --accent-ink: oklch(20% 0.02 35);
    --action: oklch(74% 0.125 30); --action-ink: oklch(20% 0.02 35); --action-hover: oklch(79% 0.12 30);
    --link: oklch(80% 0.11 30); --focus: oklch(80% 0.12 30);
    --ok: oklch(80% 0.1 155); --ok-wash: oklch(28% 0.04 155);
    --warn: oklch(82% 0.1 80); --warn-wash: oklch(30% 0.05 75);
    --danger: oklch(78% 0.13 25); --danger-wash: oklch(29% 0.05 25);
    --scrim: oklch(8% 0.01 40 / 0.65);
    --edge: inset 0 1px 0 oklch(100% 0 0 / 0.06), 0 0 0 1px oklch(100% 0 0 / 0.07);
    --lift: 0 12px 28px -10px oklch(5% 0.01 40 / 0.7);
  }
  * { box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 var(--text-base)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  b, strong { font-weight: 600; }
  svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; transition: none; }
  .bar { background: var(--paper); border-bottom: 1px solid var(--rule); }
  .bar-in { max-width: 1240px; margin: 0 auto; padding: 0 24px; min-height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; letter-spacing: -0.02em; }
  .brand img { display: block; width: 32px; height: 32px; border-radius: 8px; }
  .tools { display: flex; gap: 8px; align-items: center; }
  main { max-width: 1240px; margin: 0 auto; padding: 48px 24px 96px; }
  .scene-workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 24rem); align-items: start; gap: 24px 64px; }
  h1 { margin: 0; font-size: var(--text-2xl); line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance; overflow-wrap: anywhere; }
  .intro { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
  form { background: var(--panel); border-radius: var(--radius); box-shadow: var(--edge); padding: 24px; }
  #entrada { display: grid; gap: 8px; }
  #entrada button { margin-top: 16px; }
  label { display: block; font-size: var(--text-sm); font-weight: 500; }
  input:not([type=checkbox]) { width: 100%; min-width: 0; min-height: 40px; padding: 0 12px; border: 1px solid var(--muted); border-radius: var(--radius-sm); background: var(--panel); color: var(--ink); font: inherit; }
  input:focus-visible { outline-offset: -1px; }
  button { font: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--rule-2); background: transparent; color: var(--ink); font-weight: 500; font-size: var(--text-sm); cursor: pointer; box-shadow: var(--edge); white-space: nowrap; transition: background var(--dur-micro) var(--ease), transform var(--dur-micro) var(--ease); }
  button:hover:enabled { background: var(--paper-2); }
  button:active:enabled { transform: translateY(1px); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  .primary { background: var(--action); color: var(--action-ink); border-color: transparent; }
  .primary:hover:enabled { background: var(--action-hover); }
  .icon { width: 40px; padding: 0; border-color: transparent; box-shadow: none; }
  #busca { background: transparent; box-shadow: none; padding: 0; }
  .query { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; margin-top: 8px; }
  .spoilers { display: flex; gap: 12px; align-items: center; margin-top: 16px; min-height: 40px; width: fit-content; cursor: pointer; font-weight: 400; color: var(--ink-2); }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--action); margin: 0; flex: none; }
  #estado { color: var(--muted); font-size: var(--text-sm); margin: 0; grid-column: 1 / -1; }
  #estado[data-erro] { color: var(--danger); }
  #estado:empty { display: none; }
  main:has(#busca:not([hidden])) .scene-workspace { grid-template-columns: minmax(0, 1fr); }
  #resultados { grid-column: 1 / -1; }
  article { display: grid; grid-template-columns: minmax(4.5rem, 8%) minmax(0, 1fr); gap: 16px; padding: 24px 0; border-top: 1px solid var(--rule); }
  time { font: 500 var(--text-sm) var(--mono); color: var(--link); font-variant-numeric: tabular-nums; white-space: nowrap; padding-top: 4px; }
  .excerpt { min-width: 0; }
  article strong { display: block; color: var(--muted); font-size: var(--text-sm); font-weight: 500; }
  article blockquote { margin: 8px 0 0; font-size: var(--text-xl); line-height: 1.4; font-weight: 500; letter-spacing: -0.01em; white-space: pre-wrap; overflow-wrap: anywhere; }
  @media (max-width: 48rem) { .scene-workspace { grid-template-columns: minmax(0, 1fr); } main, .bar-in { padding-inline: 16px; } article { grid-template-columns: minmax(0, 1fr); gap: 8px; } }
  @media (max-width: 360px) { .query { grid-template-columns: minmax(0, 1fr); } }
  @media (pointer: coarse) { button { min-height: 44px; } input:not([type=checkbox]) { min-height: 48px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition-duration: 0.01ms !important; } }
</style>
<script>try{var t=localStorage.getItem('rustyfin-tema');if(!t&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sun-moon" viewBox="0 0 24 24"><path d="M12 2v2" /> <path d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715" /> <path d="M16 12a4 4 0 0 0-4-4" /> <path d="m19 5-1.256 1.256" /> <path d="M20 12h2" /></symbol>
</svg>
<header class="bar"><div class="bar-in">
  <span class="brand"><img id="marca" src="/admin/logo.png" alt="" width="32" height="32">Rustyfin</span>
  <div class="tools">
    <button id="sair" type="button" hidden>Sair</button>
    <button class="icon" type="button" id="tema" aria-label="Alternar entre tema claro e escuro"><svg class="i" aria-hidden="true"><use href="#i-sun-moon"/></svg></button>
  </div>
</div></header>
<main>
<div class="scene-workspace">
<div class="scene-heading">
<h1>Busca de cenas</h1>
<p class="intro" id="intro">Entre com seu perfil para pesquisar falas da biblioteca.</p>
</div>
<form id="entrada" method="post" aria-label="Entrar no Rustyfin">
  <label for="usuario">Usuário</label>
  <input id="usuario" name="usuario" autocomplete="username" required>
  <label for="senha">Senha</label>
  <input id="senha" name="senha" type="password" autocomplete="current-password">
  <button class="primary">Entrar</button>
</form>
<form id="busca" role="search" aria-label="Buscar nas legendas" hidden>
  <label for="termo">Trecho da fala</label>
  <div class="query">
    <input id="termo" name="termo" type="search" required minlength="2" maxlength="128">
    <button class="primary">Buscar</button>
  </div>
  <label class="spoilers"><input name="spoilers" type="checkbox"> Incluir cenas além do meu progresso</label>
</form>
<p id="estado" role="status"></p>
<div id="resultados"></div>
</div>
</main>
<script>
const entrada = document.getElementById('entrada');
const busca = document.getElementById('busca');
const estado = document.getElementById('estado');
const resultados = document.getElementById('resultados');
const sair = document.getElementById('sair');
const intro = document.getElementById('intro');
let token, geracao = 0;
const el = (tag, texto) => Object.assign(document.createElement(tag), {textContent: texto});
function mensagem(texto, erro = false) {
  estado.toggleAttribute('data-erro', erro);
  estado.textContent = texto;
}
entrada.onsubmit = async (evento) => {
  evento.preventDefault();
  const botao = entrada.querySelector('button');
  botao.disabled = true;
  botao.textContent = 'Entrando…';
  mensagem('');
  try {
    const r = await fetch('/Users/AuthenticateByName', {method: 'POST', headers: {
      'Content-Type': 'application/json', 'X-Emby-Authorization': 'MediaBrowser Client="Rustyfin Cenas"',
    }, body: JSON.stringify({Username: entrada.usuario.value, Pw: entrada.senha.value})});
    if (!r.ok) throw new Error('Confira o usuário e a senha.');
    token = (await r.json()).AccessToken;
    entrada.hidden = true;
    busca.hidden = false;
    sair.hidden = false;
    intro.textContent = 'Encontre uma fala nas legendas indexadas.';
    busca.termo.focus();
  } catch (e) { mensagem(e.message, true); }
  finally {
    entrada.senha.value = '';
    botao.disabled = false;
    botao.textContent = 'Entrar';
  }
};
busca.onsubmit = async (evento) => {
  evento.preventDefault();
  const atual = ++geracao;
  resultados.replaceChildren();
  mensagem('Buscando…');
  resultados.setAttribute('aria-busy', 'true');
  try {
    const query = new URLSearchParams({q: busca.termo.value, spoilers: busca.spoilers.checked});
    const r = await fetch('/api/cenas?' + query, {headers: {'X-Emby-Token': token}});
    if (!r.ok) throw new Error('Não foi possível buscar as cenas.');
    const cenas = await r.json();
    if (atual !== geracao) return;
    const lista = document.createDocumentFragment();
    for (const c of cenas) {
      const sec = Math.floor(c.inicioTicks / 10000000);
      const artigo = document.createElement('article');
      const trecho = document.createElement('div');
      trecho.className = 'excerpt';
      const tempo = el('time', Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'));
      tempo.dateTime = 'PT' + sec + 'S';
      trecho.append(el('strong', c.titulo), el('blockquote', c.previa));
      artigo.append(tempo, trecho);
      lista.append(artigo);
    }
    resultados.append(lista);
    mensagem(cenas.length ? cenas.length + (cenas.length === 1 ? ' fala encontrada' : ' falas encontradas') :
      'Nenhuma fala encontrada. Tente outro trecho.');
  } catch (e) {
    if (atual === geracao) mensagem(e.message, true);
  } finally {
    if (atual === geracao) resultados.removeAttribute('aria-busy');
  }
};
busca.spoilers.onchange = () => {
  geracao++;
  resultados.replaceChildren();
  resultados.removeAttribute('aria-busy');
  if (busca.termo.value.trim().length >= 2) busca.requestSubmit();
  else mensagem('');
};
sair.onclick = () => {
  const anterior = token;
  token = undefined;
  geracao++;
  resultados.replaceChildren();
  resultados.removeAttribute('aria-busy');
  busca.reset();
  busca.hidden = true;
  entrada.hidden = false;
  sair.hidden = true;
  intro.textContent = 'Entre com seu perfil para pesquisar falas da biblioteca.';
  mensagem('');
  entrada.usuario.focus();
  if (anterior) fetch('/Sessions/Logout', {method: 'POST', headers: {'X-Emby-Token': anterior}}).catch(() => {});
};

const raiz = document.documentElement;
function aplicarTema(tema) {
  raiz.dataset.theme = tema;
  document.getElementById('marca').src = tema === 'dark' ? '/admin/logo-dark.png' : '/admin/logo.png';
}
aplicarTema(raiz.dataset.theme || 'light');
document.getElementById('tema').onclick = () => {
  const proximo = raiz.dataset.theme === 'dark' ? 'light' : 'dark';
  aplicarTema(proximo);
  try { localStorage.setItem('rustyfin-tema', proximo); } catch (_) { /* sem armazenamento */ }
};
</script>
</body></html>
