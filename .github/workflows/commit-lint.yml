name: Commit lint

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validar novos commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          # Último commit anterior ao padrão. Também cobre o primeiro push da adoção.
          LEGACY_TIP: a0a1391237a612197ee3958c6cd8e5e4331f983c
        run: |
          if [[ "$BASE" == 0000000000000000000000000000000000000000 ]]; then
            BASE="$LEGACY_TIP"
          fi
          python tools/commitlint.py range "$BASE" "$HEAD" --exclude "$LEGACY_TIP"
      - name: Validar título do pull request
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python tools/commitlint.py title -- "$PR_TITLE"
