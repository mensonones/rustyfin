[package]
name = "rustyfin"
version = "0.20.4"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
description = "Lightweight localhost media server in Rust compatible with Jellyfin clients"

[lints.rust]
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Exceções ao pedantic, com motivo (o resto segue como aviso):
cast_possible_truncation = "allow" # ticks, tamanhos e bitrates: conversões numéricas controladas pelo domínio
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"   # os DTOs espelham o contrato da API do Jellyfin (várias flags)
needless_pass_by_value = "allow"   # extratores do axum (State, Path, Query) são recebidos por valor
too_many_lines = "allow"
items_after_statements = "allow"
format_push_string = "allow"
similar_names = "allow"
assert_is_empty = "allow"        # nos testes
# A biblioteca é interna ao servidor (não é publicada): documentar cada erro/pânico das funções públicas
# e marcar tudo com #[must_use] só geraria ruído.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
module_name_repetitions = "allow"
implicit_hasher = "allow"          # os extratores do axum fixam HashMap<String, String>

[dependencies]
hyper = "1"
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2", "service"] }
tower = { version = "0.5", default-features = false }
axum = { version = "0.7", features = ["macros", "multipart", "ws"] }
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "set-header"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "tls-none"] }
uuid = { version = "1.8", features = ["v4", "v5", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
mime_guess = "2.0"
dirs = "5.0"
regex = "1"
notify = "6"
futures-core = "0.3"
base64 = "0.22"
argon2 = "0.5"
serde_urlencoded = "0.7"
sha2 = "0.10"

[dev-dependencies]
tower = { version = "0.5", default-features = false, features = ["util"] }
